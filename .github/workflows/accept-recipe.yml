# Adds a recipe submitted from the site (as a GitHub issue) to data/community.json
# when a cookbook editor puts the "approved" label on the issue.
name: Accept recipe submission

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: accept-recipe
  cancel-in-progress: false

jobs:
  accept:
    if: github.event.label.name == 'approved' && contains(github.event.issue.body, 'cookbook-recipe')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add recipe to community.json
        id: add
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          title=$(python3 tools/accept_submission.py)
          echo "title=$title" >> "$GITHUB_OUTPUT"

      - name: Commit
        env:
          TITLE: ${{ steps.add.outputs.title }}
          NUM: ${{ github.event.issue.number }}
        run: |
          git config user.name "cookbook-bot"
          git config user.email "cookbook-bot@users.noreply.github.com"
          git add data/community.json
          git commit -m "Add recipe: $TITLE (#$NUM)" || echo "No change"
          git push

      - name: Close issue
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: gh issue close "$NUM" --repo "$GITHUB_REPOSITORY" --comment "Added to the cookbook. It will appear on the site within a couple of minutes."

      - name: Report a problem
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body "Couldn't add this recipe automatically — check the Actions log. The recipe block may have been edited or cut off."
